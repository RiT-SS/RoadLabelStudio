<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="460" viewBox="0 0 1440 460" role="img" aria-labelledby="title desc">
  <title id="title">RoadLabel Studio 工作流</title>
  <desc id="desc">上传巡检视频、配置视觉模型与分类策略、逐帧人工复核、导出候选时序区间。模型按需加载，原始判断和人工修改独立保存。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#8aaba0" stroke-width="1.5"/></marker></defs>
  <rect width="1440" height="460" rx="24" fill="#f0f5f3"/>
  <g font-family="Arial, 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif">
    <text x="56" y="56" font-size="17" fill="#157761" font-weight="700" letter-spacing="3">ROADLABEL STUDIO</text>
    <text x="56" y="108" font-size="35" fill="#172b3a" font-weight="700">让视频初标、人工复核与候选导出连起来</text>
    <text x="56" y="145" font-size="19" fill="#607281">可配置的视觉模型 · 可追溯的标注版本 · 可调整的候选时序区间</text>
    <g fill="#ffffff" stroke="#d7e3de" stroke-width="1.5"><rect x="56" y="190" width="300" height="170" rx="16"/><rect x="399" y="190" width="300" height="170" rx="16"/><rect x="742" y="190" width="300" height="170" rx="16"/><rect x="1085" y="190" width="300" height="170" rx="16"/></g>
    <g stroke="#8aaba0" stroke-width="2" marker-end="url(#arrow)"><path d="M366 276h21"/><path d="M709 276h21"/><path d="M1052 276h21"/></g>
    <g fill="#e1f0e9"><circle cx="93" cy="229" r="18"/><circle cx="436" cy="229" r="18"/><circle cx="779" cy="229" r="18"/><circle cx="1122" cy="229" r="18"/></g>
    <g fill="#157761" font-size="18" font-weight="700" text-anchor="middle"><text x="93" y="235">1</text><text x="436" y="235">2</text><text x="779" y="235">3</text><text x="1122" y="235">4</text></g>
    <g fill="#172b3a" font-size="25" font-weight="700"><text x="121" y="238">视频上传</text><text x="464" y="238">AI 初标</text><text x="807" y="238">人工复核</text><text x="1150" y="238">候选导出</text></g>
    <g fill="#607281" font-size="19"><text x="80" y="286">原始帧索引 / 时间戳</text><text x="80" y="322">视频库与进度管理</text><text x="423" y="286">视觉模型 + 分类 Skills</text><text x="423" y="322">逐类评分与可见依据</text><text x="766" y="286">逐帧判断 / 备注修正</text><text x="766" y="322">原始结果与修改留痕</text><text x="1109" y="286">阈值筛选 / 相邻合并</text><text x="1109" y="322">JSON / CSV 数据导出</text></g>
    <circle cx="65" cy="410" r="5" fill="#157761"/><text x="82" y="417" font-size="18" fill="#345447">本地模型按需加载与释放</text>
    <circle cx="464" cy="410" r="5" fill="#157761"/><text x="481" y="417" font-size="18" fill="#345447">AI 结果与人工意见分开保存</text>
    <circle cx="915" cy="410" r="5" fill="#157761"/><text x="932" y="417" font-size="18" fill="#345447">筛选与合并不改原始标注</text>
  </g>
</svg>

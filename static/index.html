<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#15232e"><title>路见 · 道路视频标注工作室</title><meta name="description" content="从巡检视频到可复核的道路病害标注。上传、AI 初标、逐帧复核、导出。"><link rel="stylesheet" href="/static/style.css?v=20261019-shared-gpu"></head>
<body>
<svg class="icon-sprite" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><symbol id="icon-road" viewBox="0 0 24 24"><path d="M5 21 8 3m11 18L16 3M12 3v3m0 5v3m0 5v2"/></symbol><symbol id="icon-library" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 9v11"/></symbol><symbol id="icon-review" viewBox="0 0 24 24"><path d="M9 3H5a2 2 0 0 0-2 2v4m12-6h4a2 2 0 0 1 2 2v4M3 15v4a2 2 0 0 0 2 2h4m6 0h4a2 2 0 0 0 2-2v-4"/><path d="m9 12 2 2 4-4"/></symbol><symbol id="icon-jobs" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></symbol><symbol id="icon-skills" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="9" cy="6" r="2" fill="currentColor"/><circle cx="16" cy="12" r="2" fill="currentColor"/><circle cx="8" cy="18" r="2" fill="currentColor"/></symbol><symbol id="icon-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="m10 3-1 3-3 1-3 3v4l3 3 3 1 1 3h4l1-3 3-1 3-3v-4l-3-3-3-1-1-3Z"/></symbol><symbol id="icon-logout" viewBox="0 0 24 24"><path d="M9 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h4m6-16 4 4-4 4m-8-4h12" transform="translate(0 3) scale(1 .75)"/></symbol><symbol id="icon-video" viewBox="0 0 24 24"><rect x="3" y="5" width="13" height="14" rx="2"/><path d="m16 10 5-3v10l-5-3Z"/></symbol><symbol id="icon-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol><symbol id="icon-layers" viewBox="0 0 24 24"><path d="m12 3 10 6-10 6L2 9Zm-9 11 9 5 9-5m-18 5 9 5 9-5" transform="translate(1 0) scale(.9)"/></symbol><symbol id="icon-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></symbol><symbol id="icon-upload" viewBox="0 0 24 24"><path d="M12 16V3m-5 5 5-5 5 5M4 16v5h16v-5"/></symbol><symbol id="icon-arrow" viewBox="0 0 24 24"><path d="M4 12h16m-6-6 6 6-6 6"/></symbol><symbol id="icon-download" viewBox="0 0 24 24"><path d="M12 3v13m-5-5 5 5 5-5M4 17v4h16v-4"/></symbol></svg>
<div id="login" class="login hidden"><form id="login-form" class="login-card"><div class="brand-mark"><svg class="icon" aria-hidden="true"><use href="#icon-road"></use></svg></div><span class="eyebrow">ROADLABEL STUDIO</span><h1>欢迎回到路见</h1><p>登录你的道路视频标注工作室。</p><label>工作室密码<input id="password" type="password" autocomplete="current-password" required></label><button class="primary" type="submit">进入工作室 →</button><p id="login-error" role="alert"></p></form></div>
<div id="shell" class="shell hidden">
  <aside class="sidebar">
    <a class="brand" href="#library" aria-label="路见视频库"><span class="brand-mark"><svg class="icon" aria-hidden="true"><use href="#icon-road"></use></svg></span><span>路见<small>RoadLabel Studio</small></span></a>
    <div class="workspace-label"><span class="workspace-avatar">研</span><div>道路病害研究<small>团队标注工作空间</small></div></div>
    <p class="nav-label">工作空间</p><nav aria-label="主导航">
<button data-view="library" title="视频库" aria-label="视频库"><span class="nav-icon"><svg class="icon" aria-hidden="true"><use href="#icon-library"></use></svg></span><span class="nav-text">视频库</span><b id="nav-count">0</b></button>
<button data-view="review" title="标注工作台" aria-label="标注工作台"><span class="nav-icon"><svg class="icon" aria-hidden="true"><use href="#icon-review"></use></svg></span><span class="nav-text">标注工作台</span></button>
<button data-view="jobs" title="任务队列" aria-label="任务队列"><span class="nav-icon"><svg class="icon" aria-hidden="true"><use href="#icon-jobs"></use></svg></span><span class="nav-text">任务队列</span><i id="queue-dot"></i></button>
<button data-view="skills" title="病害 Skills" aria-label="病害 Skills"><span class="nav-icon"><svg class="icon" aria-hidden="true"><use href="#icon-skills"></use></svg></span><span class="nav-text">病害 Skills</span></button>
</nav><div class="sidebar-bottom"><button data-view="settings" title="服务设置" aria-label="服务设置"><span class="nav-icon"><svg class="icon" aria-hidden="true"><use href="#icon-settings"></use></svg></span><span class="nav-text">服务设置</span></button><div class="local-state"><span class="status-dot"></span><div id="mode-label">本地工作室<small>数据保存在当前服务器</small></div></div><button id="logout" class="text-button" title="退出登录" aria-label="退出登录"><span class="nav-icon"><svg class="icon" aria-hidden="true"><use href="#icon-logout"></use></svg></span><span class="nav-text">退出登录</span></button></div></aside>
  <div class="main"><header class="topbar"><div><span class="muted">工作空间</span><span class="slash">/</span><span id="breadcrumb">视频库</span></div><div class="topbar-actions"><span id="header-model-state" class="model-state" role="status" aria-live="polite"><i></i><span>模型状态</span></span><span class="avatar">研</span></div></header><main id="content"></main><footer>路见 RoadLabel Studio <span>视频初标 · 人工复核 · 数据导出</span></footer></div>
</div>
<dialog id="upload-dialog"><form id="upload-form"><div class="dialog-head"><div><span class="eyebrow">视频导入</span><h2>添加巡检视频</h2></div><button type="button" class="icon-button" data-close="upload-dialog" aria-label="关闭">×</button></div><label id="drop-zone" class="drop-zone"><span class="upload-icon">↥</span><strong>拖放视频到这里，或点击选择</strong><span>MP4、MOV、MKV、WebM、AVI · 单段最长 30 分钟</span><input id="upload-file" type="file" accept=".mp4,.mov,.mkv,.webm,.avi" required></label><p id="file-name" class="muted">视频保存到工作室所在服务器。</p><progress id="upload-progress" class="hidden" max="100" value="0"></progress><p id="upload-message" class="muted"></p><div class="dialog-actions"><button type="button" data-close="upload-dialog">取消</button><button id="upload-submit" type="submit" class="primary">上传并打开 →</button></div></form></dialog>
<dialog id="job-dialog"><form id="job-form"><div class="dialog-head"><div><span class="eyebrow">AI 初标</span><h2>创建初标任务</h2></div><button type="button" class="icon-button" data-close="job-dialog" aria-label="关闭">×</button></div><p id="job-video-name" class="muted"></p><label>分析模型<select id="job-provider"></select></label><p id="provider-hint" class="hint"></p><div class="two-col"><label>分析密度<select id="job-sampling"><option value="sampled">按频率抽帧</option><option value="every_frame">每个原始帧</option></select></label><label>每秒分析帧数<input id="job-fps" type="number" min="0.2" max="10" step="0.2" value="1"></label></div><p class="hint">抽帧模式只标注实际分析的帧，中间未分析部分保持未知。逐帧模式更慢、调用次数更多。</p><label>启用的病害 Skills</label><div id="job-skills" class="check-grid"></div><div class="dialog-actions"><button type="button" data-close="job-dialog">取消</button><button class="primary" type="submit">开始初标 →</button></div></form></dialog>
<div id="toast" class="toast hidden" role="status"></div>
<script type="module" src="/static/app.js?v=20261019-shared-gpu"></script>
</body></html>
